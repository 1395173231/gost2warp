apiVersion: apps/v1
kind: Deployment
metadata:
  name: gost
  namespace: gost2warp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gost
  template:
    metadata:
      labels:
        app: gost
    spec:
      containers:
        - name: gost
          image: gogost/gost:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GOST_SOCKS_USER
              value: change_me_user
            - name: GOST_SOCKS_PASS
              value: change_me_password
          command:
            - /bin/sh
            - -ec
            - |
              if [ -z "${GOST_SOCKS_USER:-}" ] || [ -z "${GOST_SOCKS_PASS:-}" ]; then
                echo "GOST_SOCKS_USER or GOST_SOCKS_PASS is empty" >&2
                exit 1
              fi
              printf '%s %s\n' "$GOST_SOCKS_USER" "$GOST_SOCKS_PASS" > /tmp/gost_socks_auth
              chmod 600 /tmp/gost_socks_auth
              exec gost -C /etc/gost/gost.yaml -api :18080
          ports:
            - name: socks
              containerPort: 1080
            - name: api
              containerPort: 18080
          volumeMounts:
            - name: gost-config
              mountPath: /etc/gost/gost.yaml
              subPath: gost.yaml
              readOnly: true
      volumes:
        - name: gost-config
          configMap:
            name: gost-config
---
apiVersion: v1
kind: Service
metadata:
  name: gost
  namespace: gost2warp
spec:
  selector:
    app: gost
  ports:
    - name: socks
      port: 1080
      targetPort: 1080
      nodePort: 31080
    - name: api
      port: 18080
      targetPort: 18080
  type: NodePort
