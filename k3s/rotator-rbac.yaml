apiVersion: v1
kind: ServiceAccount
metadata:
  name: warp-rotator
  namespace: gost2warp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warp-rotator
  namespace: gost2warp
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warp-rotator
  namespace: gost2warp
subjects:
  - kind: ServiceAccount
    name: warp-rotator
    namespace: gost2warp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warp-rotator
