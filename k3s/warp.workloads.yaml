apiVersion: apps/v1
kind: Deployment
metadata:
  name: warp1
  namespace: gost2warp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warp1
  template:
    metadata:
      labels:
        app: warp1
    spec:
      containers:
        - name: warp
          image: caomingjun/warp:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WARP_SLEEP
              value: "2"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          resources:
            limits:
              memory: "150Mi"
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS https://dash.cloudflare.com/cdn-cgi/trace >/dev/null
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS https://dash.cloudflare.com/cdn-cgi/trace >/dev/null
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
